<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/card.css">
</head>
<body>
  <div class="product-card">
    <div class="card-top">
      <img class="card-top__image" src="assets/images/png/product-cover.png" />
      <span class="card-top__sale">Sale</span>
      <div class="icon-buttons">
        <div class="icon-button icon-button_heart"></div>
        <div class="icon-button icon-button_cart"></div>
        <div class="icon-button icon-button_eye"></div>
      </div>
    </div>
    <div class="product-card__content">
      <div class="product-card__title">
        <span class="subtitle">English Departement</span>
        <span class="rating">4.9</span>
      </div>
    </div>
  </div>
</body>
</html>
